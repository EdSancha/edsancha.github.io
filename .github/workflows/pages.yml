name: Deploy site

# Publishes production from master at the root, plus one unlisted preview per
# theme/* branch under /preview/<name>/, in a single Pages deployment.
#
# Requires: Settings -> Pages -> Build and deployment -> Source = GitHub Actions.

on:
  push:
    branches:
      - master
  # A theme/* push cannot deploy: Pages only accepts deployments to the
  # github-pages environment from master. "Theme branch check" runs on those
  # pushes instead, and a workflow_run trigger re-enters here in the master
  # context, which is allowed to deploy. Fires whatever that check concluded,
  # because build-previews.sh already skips a branch that fails to build.
  workflow_run:
    workflows: ["Theme branch check"]
    types: [completed]
  # Daily, to refresh the Garmin heatmaps.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time; queue rather than cancel so a theme
# push never drops a production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Fetches Garmin data and renders the grids in _data/heatmaps.json. This is the
  # only job that sees GARMIN_API_KEY: it is a secret of the "garmin" environment,
  # which only master may use, and only the fetch step gets it. The build job
  # also runs theme branches' code, so it never sees the key, only the SVGs.
  # Third-party code here is pinned to reviewed commits.
  heatmaps:
    name: Render Garmin heatmaps
    runs-on: ubuntu-latest
    environment: garmin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: _data/heatmaps.json
          sparse-checkout-cone-mode: false
      # garmin-heatmap has no dependencies, so a checkout of a reviewed commit
      # is all it needs: no npm, no install scripts.
      - name: Check out garmin-heatmap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EdSancha/garmin-heatmap
          ref: 39eac060b24cf6fa65f7d73ea0387d01c9ed428b # v0.3.0
          path: .garmin-heatmap
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Restore the last good heatmaps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: garmin
          key: garmin-heatmaps-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: garmin-heatmaps-
      - name: Fetch and render
        id: render
        # A Garmin outage or an expired key must never block a deploy: the
        # restored heatmaps ship instead, with a warning.
        continue-on-error: true
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: |
          if [ -z "$GARMIN_API_KEY" ]; then
            echo "::warning::GARMIN_API_KEY is not set in the garmin environment; skipping the Garmin heatmaps."
            exit 0
          fi
          node .garmin-heatmap/bin/garmin-heatmap.js build --config _data/heatmaps.json --out-dir garmin --themes light,dark,auto
          echo "fresh=true" >> "$GITHUB_OUTPUT"
      - name: Warn about stale heatmaps
        if: steps.render.outcome == 'failure'
        run: echo "::warning::Garmin fetch failed, so the last good heatmaps ship. Has GARMIN_API_KEY expired?"
      - name: Save the heatmaps for next time
        if: steps.render.outputs.fresh == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: garmin
          key: garmin-heatmaps-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garmin-heatmaps
          path: garmin
          retention-days: 1
          if-no-files-found: ignore

  build:
    name: Build site and previews
    needs: heatmaps
    # Build even if the heatmaps job failed outright; the site just lacks them.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Always build production from master, whichever branch triggered the run,
      # so pushing a theme branch can never publish theme content at the root.
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Add the Garmin heatmaps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: garmin-heatmaps
          path: _includes/garmin
      - name: Publish the standalone heatmap images
        # <name>-light.svg, <name>-dark.svg and <name>-auto.svg (reads on any
        # background; the GitHub profile README uses it) go to /assets/garmin/
        # for places that can only show images. Pages inline <name>.svg instead.
        run: |
          mkdir -p assets/garmin
          if [ -d _includes/garmin ]; then
            find _includes/garmin \( -name '*-light.svg' -o -name '*-dark.svg' -o -name '*-auto.svg' \) -exec mv -t assets/garmin/ {} +
          fi
          ls assets/garmin
      - name: List the Garmin heatmaps for Jekyll
        # _includes/helpers/garmin-heatmap.html only includes grids listed here,
        # so a missing SVG shows a note instead of breaking the build.
        run: |
          ls _includes/garmin/*.svg 2>/dev/null | xargs -r -n1 basename | sed 's/\.svg$//' \
            | jq -R . | jq -cs . > _data/garmin_rendered.json
          echo "Rendered heatmaps: $(cat _data/garmin_rendered.json)"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/configure-pages@v6
      - name: Build production site
        run: make build
      - name: Build theme previews
        run: .github/scripts/build-previews.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
