# Monthly updates, baseline from the brain's agent-workflow notes. The github-pages gem pins
# Jekyll and its plugins to what GitHub Pages runs, so it moves as one unit. Other minor and patch
# bumps are grouped; majors get their own pull request. CI (.github/workflows/ci.yml) builds and
# proofs every pull request.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: deps
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
