<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | xml_escape }}" href="{{ '/feed.xml' | absolute_url }}">

    <!-- syntax highlighting CSS -->
    <link rel="stylesheet" href="/css/syntax.css?v={{ site.time | date: '%Y%m%d%H%M' }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/main.css?v={{ site.time | date: '%Y%m%d%H%M' }}">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SCPXBKNSLQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-SCPXBKNSLQ');
    </script>

</head>

<body>

    <div class="site">

            <div class="progressPanel">
                <span class="progress"></span>
            </div>

    {%- assign is_post = false -%}
    {%- if page.layout == 'post' -%}{%- assign is_post = true -%}{%- endif -%}
    <nav class="header" aria-label="Main">
        <a {% if page.url == "/" %}class="extra" {% endif %}href="/">Home</a>
        <a {% if page.url == "/work/" %}class="extra" {% endif %}href="/work/">Work</a>
        <a {% if page.url contains "/blog/" or is_post %}class="extra" {% endif %}href="/blog/">Writing</a>
        <a {% if page.url == "/my-reading-list/" %}class="extra" {% endif %}href="/my-reading-list/">Reading List</a>
    </nav>

    <script>
        (function () {
            var progressBar = document.querySelector('.progress');
            if (!progressBar) return;

            var update = function () {
                var docElem = document.documentElement;
                var height = docElem.scrollHeight - docElem.clientHeight;
                var readPercent = height > 0 ? (docElem.scrollTop || document.body.scrollTop) / height * 100 : 100;
                progressBar.style.transform = 'translate3d(' + (readPercent - 100) + '%, 0, 0)';
            };

            window.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', update);
            update();
        })();
    </script>
