title: Eduardo Diaz Sancha
description: >-
  Director of Engineering writing about engineering leadership, AI-assisted
  software development, and endurance training.
author: Eduardo Diaz Sancha
url: https://edsancha.com
baseurl: ""
source: .
destination: ./_site
markdown: kramdown
highlighter: rouge
paginate: 5
paginate_path: "/blog/:num"
plugins:
  - jekyll-gist
  - jekyll-paginate

# Keep tooling and docs out of the generated site.
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - CLAUDE.md
  - AGENTS.md
  - .cursor-instructions.md
  - .claude/
  - .github/
  - .editorconfig
  - vendor/
  - node_modules/
