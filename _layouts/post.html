---
layout: default
---

<p class="meta">
    <span>{{ page.date | date_to_string }}</span>
    <span>{{ page.timeToRead }}</span>
</p>

<h1>{{ page.title }}</h1>

{% if page.source_url %}
<p class="meta source">Originally published on <a href="{{ page.source_url }}" rel="external nofollow" target="_blank">{{ page.source_name | default: "another site" }}</a>{% if page.source_date %}, {{ page.source_date }}{% endif %}.</p>
{% endif %}

<div class="post">
{{ content }}
</div>
